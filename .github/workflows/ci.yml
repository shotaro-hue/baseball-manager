name: CI

# Cancel superseded runs on the same PR/ref; never use stale-green CI for merge decisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    # Validate the dependent history PR before the preparation PR is merged.
    branches: [main, test/restore-progression-e2e-main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test


  progression-e2e-suites:
    name: e2e-${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: initialization-and-progression
            files: progression.smoke.spec.js initialization.spec.js
          - name: history
            files: match-history.spec.js
          - name: posting
            files: posting.spec.js
          - name: finance
            files: finance.spec.js
          - name: save-integrity
            files: save-generations.spec.js career-generations.spec.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke suite (one worker, no retries)
        run: npm run test:e2e -- ${{ matrix.suite.files }} --workers=1 --retries=0
      - name: Upload E2E report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-e2e-${{ matrix.suite.name }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Preserve the existing required check name: any matrix failure/cancellation/skip
  # must fail this aggregate gate instead of producing partial green.
  progression-e2e:
    if: ${{ always() }}
    needs: [progression-e2e-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every smoke suite to succeed
        env:
          SMOKE_SUITE_RESULT: ${{ needs['progression-e2e-suites'].result }}
        run: test "$SMOKE_SUITE_RESULT" = success
