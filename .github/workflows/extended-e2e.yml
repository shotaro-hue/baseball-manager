name: Extended Browser E2E

# Full coverage is intentionally manual, not an automatic duplicate of every PR CI.
# Run before a release or for cross-screen changes, and review failures before
# considering a scheduled cadence.
on:
  workflow_dispatch:

jobs:
  full-browser-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run every E2E spec (one worker, no retries)
        run: npm run test:e2e -- --workers=1 --retries=0
      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
